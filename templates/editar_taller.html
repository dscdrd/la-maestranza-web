<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar taller | La Maestranza</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/editar_taller.css') }}"
    >

    <script
        src="{{ url_for('static', filename='js/editar_taller.js') }}"
        defer>
    </script>

</head>


<body>

    <main
        id="editar-taller"
        data-api-url="{{ url_for(
            'api.api_actualizar_taller',
            id_taller=taller.id_taller
        ) }}"
        data-gestion-url="{{ url_for('gestion_talleres') }}"
    >

        <h1>Editar taller</h1>


        <a href="{{ url_for('gestion_talleres') }}">
            ← Volver a gestión de talleres
        </a>


        <hr>


        <form id="form-editar-taller">

            <label for="nombre">
                Nombre:
            </label>

            <input
                type="text"
                id="nombre"
                name="nombre"
                value="{{ taller.nombre }}"
                required
            >


            <br><br>


            <label for="descripcion">
                Descripción:
            </label>

            <textarea
                id="descripcion"
                name="descripcion"
            >{{ taller.descripcion or '' }}</textarea>


            <br><br>


            <label for="horario">
                Horario:
            </label>

            <input
                type="text"
                id="horario"
                name="horario"
                value="{{ taller.horario or '' }}"
            >


            <br><br>


            <label for="cupo_maximo">
                Cupo máximo:
            </label>

            <input
                type="number"
                id="cupo_maximo"
                name="cupo_maximo"
                value="{{ taller.cupo_maximo or '' }}"
                min="1"
                required
            >


            <br><br>


            <label for="imagen">
                Imagen:
            </label>

            <input
                type="text"
                id="imagen"
                name="imagen"
                value="{{ taller.imagen or '' }}"
            >


            <br><br>


            <button
                type="submit"
                id="btn-guardar"
            >
                Guardar cambios
            </button>

        </form>


        <p
            id="mensaje-formulario"
            hidden
        ></p>

    </main>

</body>

</html>
