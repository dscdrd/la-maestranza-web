<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Editar taller | La Maestranza</title>


    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/banner.css') }}"
    >


    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/editar_taller.css') }}"
    >

</head>


<body>

    {% include "banner.html" %}


    <main class="contenedor">


        <!-- =========================
             VOLVER
        ========================== -->

        <a
            href="{{ url_for('gestion_talleres') }}"
            class="volver"
        >
            ← Volver a gestión de talleres
        </a>


        <!-- =========================
             ENCABEZADO
        ========================== -->

        <section class="encabezado">

            <p class="subtitulo">
                PANEL DE PROFESOR
            </p>

            <h1>
                Editar taller
            </h1>

            <p class="descripcion">
                Modifica la información del taller seleccionado.
            </p>

        </section>


        <!-- =========================
             FORMULARIO
        ========================== -->

        <section class="tarjeta">

            <form method="POST">


                <div class="form-grid">


                    <!-- NOMBRE -->

                    <div class="campo campo-completo">

                        <label for="nombre">
                            Nombre del taller
                        </label>

                        <input
                            type="text"
                            id="nombre"
                            name="nombre"
                            value="{{ taller.nombre }}"
                            required
                        >

                    </div>


                    <!-- DESCRIPCIÓN -->

                    <div class="campo campo-completo">

                        <label for="descripcion">
                            Descripción
                        </label>

                        <textarea
                            id="descripcion"
                            name="descripcion"
                            required
                        >{{ taller.descripcion or '' }}</textarea>

                    </div>


                    <!-- HORARIO -->

                    <div class="campo">

                        <label for="horario">
                            Horario
                        </label>

                        <input
                            type="text"
                            id="horario"
                            name="horario"
                            value="{{ taller.horario or '' }}"
                            required
                        >

                    </div>


                    <!-- CUPO -->

                    <div class="campo">

                        <label for="cupo_maximo">
                            Cupo máximo
                        </label>

                        <input
                            type="number"
                            id="cupo_maximo"
                            name="cupo_maximo"
                            value="{{ taller.cupo_maximo }}"
                            min="1"
                            required
                        >

                    </div>


                    <!-- IMAGEN -->

                    <div class="campo campo-completo">

                        <label for="imagen">
                            Imagen
                        </label>

                        <input
                            type="text"
                            id="imagen"
                            name="imagen"
                            value="{{ taller.imagen or '' }}"
                            placeholder="ejemplo.jpg"
                        >

                    </div>


                </div>


                <!-- =========================
                     ACCIONES
                ========================== -->

                <div class="acciones-formulario">

                    <a
                        href="{{ url_for('gestion_talleres') }}"
                        class="btn-cancelar"
                    >
                        Cancelar
                    </a>


                    <button
                        type="submit"
                        class="btn-guardar"
                    >
                        Guardar cambios
                    </button>

                </div>


            </form>

        </section>

    </main>

</body>

</html>
