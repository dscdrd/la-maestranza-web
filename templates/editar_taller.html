<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/editar_taller.css') }}"

    <title>Editar taller | La Maestranza</title>
</head>

<body>

    <h1>Editar taller</h1>

    <a href="{{ url_for('gestion_talleres') }}">
        ← Volver a gestión de talleresclear
    </a>

    <hr>

    <form method="POST">

        <label for="nombre">Nombre:</label>

        <input
            type="text"
            id="nombre"
            name="nombre"
            value="{{ taller.nombre }}"
            required
        >

        <br><br>


        <label for="descripcion">Descripción:</label>

        <textarea
            id="descripcion"
            name="descripcion"
        >{{ taller.descripcion or '' }}</textarea>

        <br><br>


        <label for="horario">Horario:</label>

        <input
            type="text"
            id="horario"
            name="horario"
            value="{{ taller.horario or '' }}"
        >

        <br><br>


        <label for="cupo_maximo">Cupo máximo:</label>

        <input
            type="number"
            id="cupo_maximo"
            name="cupo_maximo"
            value="{{ taller.cupo_maximo or '' }}"
            min="1"
            required
        >

        <br><br>


        <label for="imagen">Imagen:</label>

        <input
            type="text"
            id="imagen"
            name="imagen"
            value="{{ taller.imagen or '' }}"
        >

        <br><br>


        <button type="submit">
            Guardar cambios
        </button>

    </form>

</body>

</html>
