<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seleccionar taller</title>

    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/talleres.css') }}">
</head>
<body>
    <main class="seleccion-taller">
        <img
            src="{{ url_for('static', filename='img/logo.png') }}"
            alt="Maestranza Escuela del Movimiento"
            class="logo"
        >

        <h1>NUESTROS TALLERES</h1>

        <div class="selector">
            <label for="taller">Selecciona tu taller</label>

            <select
                id="taller"
                name="id_taller"
                data-api-url="{{ url_for('api_talleres') }}"
                disabled
            >
                <option value="">Cargando talleres...</option>
            </select>

            <p id="mensaje" role="status" aria-live="polite">
                Consultando talleres disponibles…
            </p>
        </div>

        <section id="detalle-taller" class="detalle-taller" hidden>
    <h2 id="nombre-taller"></h2>
    <p id="descripcion-taller"></p>

    <p>
        <strong>Horario:</strong>
        <span id="horario-taller"></span>
    </p>

    <p>
        <strong>Capacidad máxima por clase:</strong>
        <span id="cupo-taller"></span>
    </p>
</section>

        <a href="{{ url_for('inicio') }}">Volver al inicio</a>
    </main>

    <script
        src="{{ url_for('static', filename='js/talleres.js') }}"
        defer
    ></script>
</body>
</html>
